# ===========================
# Tmux Configuration
# ===========================

# ----------------------------
# 1. Change Prefix Key
# ----------------------------
# Unbind default prefix (Ctrl+b)
unbind C-b

# Set new prefix to Ctrl+a (more ergonomic)
set-option -g prefix C-a

# Bind Ctrl+a Ctrl+a to send prefix to nested tmux session
bind-key C-a send-prefix

# ----------------------------
# 2. Enable Mouse Support
# ----------------------------
# Enable mouse mode for:
# - Clicking to switch panes
# - Resizing panes by dragging
# - Scrolling through history
set -g mouse on

# ----------------------------
# 3. Improve Color Support
# ----------------------------
# Enable 256 color support
set -g default-terminal "screen-256color"

# Enable true color (RGB) support if terminal supports it
set-option -sa terminal-overrides ",xterm*:Tc"

# ----------------------------
# 4. Status Bar Configuration
# ----------------------------
# Center the window list in the status bar (absolute center of terminal)
set -g status-justify absolute-centre

# Update status bar every 3 seconds
set -g status-interval 3

# Set status bar length
set -g status-left-length 200
set -g status-right-length 200

# Display session name with terminal icon in status bar left section
set -g status-left "  #S "

# Display CPU and memory usage in status bar right section
set -g status-right ""

set -g window-status-format " #I:#W"
set -g window-status-current-format "#[bg=#2e3440,fg=#a3be8c,bold]  #I:#W #[default]"

# ----------------------------
# 5. Window & Pane Indexing
# ----------------------------
# Start window numbering at 1 instead of 0
# This is more ergonomic since number keys 1-9 are easier to reach than 0
set -g base-index 1

# Start pane numbering at 1 instead of 0
# Keeps consistency with window numbering
set -g pane-base-index 1

# Automatically renumber windows when one is closed
# Prevents gaps in window numbering (e.g., keeps 1,2,3,4 instead of 1,2,4,5)
set -g renumber-windows on

# Automatically rename windows based on current directory
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# ----------------------------
# 6. Key Bindings
# ----------------------------
# Refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Split horizontally in CWD with \
unbind %
bind \\ split-window -h -c "#{pane_current_path}"

# Split vertically in CWD with -
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# ----------------------------
# 7. Vi Mode & Copy Settings
# ----------------------------
# Enable vi mode to allow vim movements
set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Copy text with "y"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste from system clipboard with ]
bind ] run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"

# Don't exit copy mode when dragging with mouse
# unbind -T copy-mode-vi MouseDragEnd1Pane

# ----------------------------
# 8. Plugin Management (TPM)
# ----------------------------
# TPM (Tmux Plugin Manager) allows you to install and manage tmux plugins easily.
#
# HOW TO USE:
# 1. Add plugins below using: set -g @plugin 'author/plugin-name'
# 2. Press PREFIX + I (Ctrl+a then Shift+i) to install new plugins
# 3. Press PREFIX + U (Ctrl+a then Shift+u) to update plugins
# 4. Press PREFIX + alt + u to uninstall plugins not in the list
#
# Plugin format examples:
#   set -g @plugin 'github_username/plugin_name'        # Default branch
#   set -g @plugin 'github_username/plugin_name#branch' # Specific branch
#   set -g @plugin 'git@github.com:user/plugin'         # SSH URL
#   set -g @plugin 'git@bitbucket.com:user/plugin'      # Bitbucket

# ----------------------------
# Required Plugins
# ----------------------------
# TPM itself - Required to manage all other plugins
# Repository: https://github.com/tmux-plugins/tpm
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults for tmux (UTF-8 support, better status refresh, etc.)
# Repository: https://github.com/tmux-plugins/tmux-sensible
set -g @plugin 'tmux-plugins/tmux-sensible'

# Seamless navigation between tmux panes and vim splits
# Ctrl+h/j/k/l to navigate in any direction (left/down/up/right)
# Ctrl+\ to navigate to previous pane
# NOTE: Requires installing the matching plugin in Vim/Neovim to work!
# Vim plugin: https://github.com/christoomey/vim-tmux-navigator
# Repository: https://github.com/christoomey/vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'


# ----------------------------
# Optional Plugins (Uncomment to enable)
# ----------------------------
# Session restoration - Save/restore tmux sessions across reboots
# PREFIX + Ctrl+s to save, PREFIX + Ctrl+r to restore
# set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatic session save/restore (requires tmux-resurrect)
# Automatically saves sessions every 15 minutes
# set -g @plugin 'tmux-plugins/tmux-continuum'

# Easy pane navigation with vim-like keybindings
# PREFIX + h/j/k/l to navigate panes
# set -g @plugin 'tmux-plugins/tmux-pain-control'

# Copy to system clipboard
# PREFIX + y to copy to clipboard, PREFIX + Y to copy working directory
# set -g @plugin 'tmux-plugins/tmux-yank'

# Better search and highlighting
# PREFIX + / to search, PREFIX + Ctrl+f for file search
# set -g @plugin 'tmux-plugins/tmux-copycat'

# Open highlighted files/URLs
# PREFIX + o to open selection
set -g @plugin 'tmux-plugins/tmux-open'

# Beautiful theme (Catppuccin)
# set -g @plugin 'catppuccin/tmux'

# ----------------------------
# Initialize TPM
# ----------------------------
# IMPORTANT: This MUST be the last line in tmux.conf
# It initializes the plugin manager and loads all declared plugins
run '~/.tmux/plugins/tpm/tpm'
